- name: Install nginx and dashboard service
  hosts: all
  tasks:
    - name: Install nginx
      become: true
      ansible.builtin.apt:
        name: nginx
        state: latest
        update_cache: true
        lock_timeout: 60
 
    - name: Create dashboard service user
      become: true
      ansible.builtin.user:
        name: dashboard
        system: true
        shell: /usr/sbin/nologin
        create_home: false

    - name: Create dashboard application directory
      become: true
      ansible.builtin.file:
        path: /opt/dashboard
        state: directory
        owner: dashboard
        group: dashboard
        mode: '0755'

    - name: Download dashboard service
      become: true
      ansible.builtin.get_url:
        url: https://github.com/hashicorp/demo-consul-101/releases/download/0.0.3.1/dashboard-service_linux_arm64.zip
        dest: /tmp/dashboard-service_linux_arm64.zip
        mode: '0644'

    - name: Extract dashboard service
      become: true
      ansible.builtin.unarchive:
        src: /tmp/dashboard-service_linux_arm64.zip
        dest: /opt/dashboard
        remote_src: true
    - name: Rename dashboard binary
      become: true
      ansible.builtin.command:
        cmd: mv /opt/dashboard/dashboard-service_linux_arm64 /opt/dashboard/dashboard-service
    - name: Set dashboard binary permissions
      become: true
      ansible.builtin.file:
        path: /opt/dashboard/dashboard-service
        owner: dashboard
        group: dashboard
        mode: '0755'

    - name: Create dashboard systemd service
      become: true
      ansible.builtin.copy:
        dest: /etc/systemd/system/dashboard.service
        mode: '0644'
        content: |
          [Unit]
          Description=Dashboard Service
          After=network.target

          [Service]
          Environment=PORT="8000"
          Type=simple
          User=dashboard
          Group=dashboard
          ExecStart=/opt/dashboard/dashboard-service
          ExecStop=/bin/sleep 5
          Restart=always

          [Install]
          WantedBy=multi-user.target

    - name: Enable and start dashboard service
      become: true
      ansible.builtin.systemd_service:
        name: dashboard.service
        enabled: true
        state: started
        daemon_reload: true
    - name: Exercise9-Restart everything
      command: echo "this task will restart all install services"
      notify: "restart all"
    - name: Get service facts
      become: true
      ansible.builtin.service_facts:

    - name: Print service status
      become: true
      ansible.builtin.debug:
        msg: "{{ item }}: {{ ansible_facts.services[item + '.service'].state | default('not found') }}"
      loop:
        - nginx
        - dashboard
  handlers:
    - name: Restart nginx
      become: true
      ansible.builtin.service:
        name: nginx
        state: restarted
      listen: "restart all"
    - name: Restart dashboard
      become: true
      ansible.builtin.service:
        name: dashboard.service
        state: restarted
      listen: "restart all"
      
    
